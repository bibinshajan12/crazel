server {
    listen 80;

    # Serve static files from /usr/share/nginx/html
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # If a request does not match a file, redirect it to index.html
        try_files $uri /index.html;
    }

    # Serve the static assets normally
    location /static/ {
        root /usr/share/nginx/html;
    }

    error_page 404 /index.html;
    location = /index.html {
        root /usr/share/nginx/html;
    }
}

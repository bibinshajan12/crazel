services:
  frontend:
    build:
      context: ./crazel_frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:      
      - REACT_APP_BACKEND_URL=http://backend:8000
    networks:
      - webnet
    depends_on:
      - backend

  backend:
    build:
      context: ./crazel_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - webnet
    environment:      
      - DJANGO_ALLOWED_HOSTS=localhost,backend


networks:
  webnet:

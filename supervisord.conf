[supervisord]
nodaemon=true

[program:django]
command=/backend/venv/bin/python /backend/crazel_backend/manage.py runserver 0.0.0.0:8000
autostart=true
autorestart=true
stderr_logfile=/var/log/django.err.log
stdout_logfile=/var/log/django.out.log

[program:flask]
command=/backend/venv/bin/python /backend/flutter_service/run.py
autostart=true
autorestart=true
stderr_logfile=/var/log/flask.err.log
stdout_logfile=/var/log/flask.out.log

[program:flutter]
command=dart /flutter_service/bin/flutter_service.dart
autostart=true
autorestart=true
stderr_logfile=/var/log/flutter.err.log
stdout_logfile=/var/log/flutter.out.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

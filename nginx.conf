server {
    listen 80;
    server_name localhost;

    # Serve the React app from the build folder
    root /usr/share/nginx/html;
    index index.html;

    # Handle all routes by serving index.html (for React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ requests to the Django backend
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route to serve Flutter web builds dynamically
    location /([a-zA-Z0-9_-]+)/web/ {
        alias /usr/share/nginx/html/$1/web/;  # Set alias to serve Flutter files
        index index.html;

        # Improved try_files for better handling of 404 errors
        try_files $uri $uri/ /$1/web/index.html;

        add_header X-Frame-Options "ALLOWALL";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
